<script>
  // Theme before first paint: ?theme= from a demo's back link, else the stored choice, else the system preference.
  // Arc themes key off data-theme on <html>.
  (function () {
    var t = null, u = new URL(location.href);
    var q = u.searchParams.get("theme");
    if (q === "light" || q === "dark") {
      t = q;
      try { localStorage.setItem("theme", q); } catch (e) {}
      u.searchParams.delete("theme");
      history.replaceState(history.state, "", u.pathname + u.search + u.hash);
    } else {
      try { t = localStorage.getItem("theme"); } catch (e) {}
    }
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  })();
</script>
